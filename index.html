<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeremy Ky</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>

<body>
  <!-- NAV -->
  <header class="site-header">
    <nav class="nav container">
      <a class="nav__brand" href="/">Jeremy Ky</a>

      <div class="nav__right">
        <a href="/pages/projects.html">Projects</a>
        <a href="/pages/about.html">About</a>
        <a href="/blog/">Blog</a>

        <!-- Theme toggle -->
<button class="theme-toggle" type="button" aria-label="Toggle black/white theme">
  <span class="toggle-track">
    <span class="toggle-thumb"></span>
  </span>
</button>


      </div>
    </nav>
  </header>

  <!-- HERO -->
  <main class="container">
    <section class="hero">
      <div class="hero__text">
        <p class="hero__hello">Hello!</p>

        <h1 class="hero__title">I’m Jeremy, a computer science & statistics student.</h1>

        <p class="hero__subtitle">
          I build ML + systems projects and write technical case studies.
        </p>

        <div class="hero__links">
          <a href="/pages/projects.html">Highlighted Work</a>
          <a href="/blog/">Technical Blog</a>
          <a href="mailto:juh7hc@virginia.edu">Email</a>
          <a href="https://github.com/jeremyky" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </div>

      <div class="hero__media">
        <img
          class="portrait"
          src="/assets/img/homepage-photo.png"
          alt="Portrait of Jeremy Ky"
          loading="lazy"
        />
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer">
      <p class="footer__small">© <span id="year"></span> Jeremy Ky</p>
      <div class="footer__links">
        <a href="mailto:juh7hc@virginia.edu">juh7hc@virginia.edu</a>
      </div>
    </div>
  </footer>

<script>
  // Set year
  document.getElementById("year").textContent = new Date().getFullYear();

  const root = document.documentElement;
  const btn = document.querySelector(".theme-toggle");

  const saved = localStorage.getItem("theme");
  if (saved) {
    root.setAttribute("data-theme", saved);
  }

  btn.addEventListener("click", () => {
    const current = root.getAttribute("data-theme") || "light";
    const next = current === "bw" ? "light" : "bw";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });
</script>

</body>
</html>
