<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery · Jeremy Ky</title>
  <link rel="icon" href="../assets/img/favicon.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script src="/assets/js/theme.js"></script>
</head>

<body>
  <!-- NAV -->
  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a class="nav__brand" href="/">Jeremy Ky</a>
      <div class="nav__right">
        <a href="/pages/about.html">About Me</a>
        <a href="/pages/experience.html">Experience</a>
        <a href="/pages/projects.html">Projects</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
          <svg class="theme-icon theme-icon--moon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z" />
          </svg>
          <svg class="theme-icon theme-icon--sun" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="container page">
    <header class="page__header">
      <h1 class="page__title">Gallery</h1>
      <p class="page__subtitle">Photos, screenshots, and visuals from projects + life.</p>
    </header>

    <div class="gallery-filters">
      <button class="pill is-active" type="button" data-filter="all">All</button>
      <button class="pill" type="button" data-filter="projects">Projects</button>
      <button class="pill" type="button" data-filter="travel">Travel</button>
      <button class="pill" type="button" data-filter="people">People</button>
    </div>

<!-- FLIP GALLERY -->
<section class="gallery" aria-label="Image gallery">
  <article class="flip" data-tags="travel">
    <button class="flip__inner" type="button" aria-label="Flip card">
      <!-- FRONT -->
      <div class="flip__face flip__front">
        <img
          src="/assets/img/gallery/mizata-horses.JPG"
          alt="Riding horses along the beach in El Salvador"
          loading="lazy"
        />
      </div>

      <!-- BACK (single clean line) -->
      <div class="flip__face flip__back">
        <p class="flip__line">Mizata, El Salvador</p>
      </div>
    </button>
  </article>
</section>


      <!-- Copy/paste more flip cards -->
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer">
      <p class="footer__small">© <span id="year"></span> Jeremy Ky</p>
      <div class="footer__links">
        <a href="mailto:juh7hc@virginia.edu">juh7hc@virginia.edu</a>
      </div>
    </div>
  </footer>

<script>
  // Year
  document.getElementById("year").textContent = new Date().getFullYear();

  // Theme toggle


  // Filters (updated: .flip)
  const pills = document.querySelectorAll(".pill");
  const cards = document.querySelectorAll(".flip");

  pills.forEach(p => {
    p.addEventListener("click", () => {
      pills.forEach(x => x.classList.remove("is-active"));
      p.classList.add("is-active");

      const filter = p.dataset.filter;
      cards.forEach(card => {
        const tags = (card.dataset.tags || "").split(" ");
        const show = filter === "all" || tags.includes(filter);
        card.style.display = show ? "" : "none";
      });
    });
  });

  // Flip cards on click
  document.querySelectorAll(".flip__inner").forEach((btn) => {
    btn.addEventListener("click", () => {
      btn.closest(".flip").classList.toggle("is-flipped");
    });
  });

  // Optional: press Escape to flip all back
  window.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    document.querySelectorAll(".flip.is-flipped").forEach(card => {
      card.classList.remove("is-flipped");
    });
  });
</script>

</body>
</html>
